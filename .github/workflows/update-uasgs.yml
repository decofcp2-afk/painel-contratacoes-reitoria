name: Atualizar catálogo de UASGs
on:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - scripts/update_uasgs.py
      - .github/workflows/update-uasgs.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar catálogo público
        run: python scripts/update_uasgs.py
      - name: Publicar catálogo
        run: |
          if test -z "$(git status --porcelain -- uasg-catalog.json)"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uasg-catalog.json
          git commit -m 'dados: atualizar catálogo de UASGs'
          git push
