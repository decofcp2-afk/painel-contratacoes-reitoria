name: Atualizar catálogo de UASGs
on:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - scripts/update_uasgs.py
      - .github/workflows/update-uasgs.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar catálogo público
        run: python scripts/update_uasgs.py
      - name: Conferir resposta pública da consulta de atas
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request
          url = ('https://dadosabertos.compras.gov.br/modulo-arp/1_consultarARP?'
                 'codigoUnidadeGerenciadora=153167&dataVigenciaInicialMin=2026-01-01&'
                 'dataVigenciaInicialMax=2026-12-31&pagina=1&tamanhoPagina=10')
          request = urllib.request.Request(url, headers={
              'Origin': 'https://decofcp2-afk.github.io',
              'Accept': 'application/json',
              'User-Agent': 'PainelContratacoesCPII/1.0 (consulta publica)',
          })
          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  print('HTTP:', response.status)
                  print('Access-Control-Allow-Origin:', response.headers.get('Access-Control-Allow-Origin'))
          except urllib.error.HTTPError as error:
              print('HTTP:', error.code)
              print('Access-Control-Allow-Origin:', error.headers.get('Access-Control-Allow-Origin'))
          PY
      - name: Publicar catálogo
        run: |
          if test -z "$(git status --porcelain -- uasg-catalog.json)"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uasg-catalog.json
          git commit -m 'dados: atualizar catálogo de UASGs'
          git push
