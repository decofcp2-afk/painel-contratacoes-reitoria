name: Atualizar atas dos campi CPII
on:
  schedule:
    - cron: '53 9 * * *'
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - scripts/update_atas_cpii.py
      - .github/workflows/update-atas-cpii.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar atas das UASGs do Colégio Pedro II
        run: python scripts/update_atas_cpii.py
      - name: Publicar dados
        run: |
          if test -z "$(git status --porcelain -- atas-cpii-data.json)"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atas-cpii-data.json
          git commit -m 'dados: atualizar atas dos campi do CPII'
          git push
