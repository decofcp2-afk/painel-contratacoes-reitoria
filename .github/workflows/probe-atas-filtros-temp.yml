name: Probe PNCP filters (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify portal organ suggestion source
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,time
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(req,timeout=25) as response:return response.read()
                  except Exception:
                      if attempt:raise
                      time.sleep(.4)
          html=get("https://pncp.gov.br/app/atas").decode("utf-8","replace")
          print("BASE",re.findall(r'<base[^>]+>',html)[:2])
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          for src in scripts:
              if not src.startswith("main."):continue
              url=urllib.parse.urljoin("https://pncp.gov.br/app/atas",src)
              try:
                  body=get(url).decode("utf-8","replace")
                  print("JS_URL",url,"LENGTH",len(body))
                  for pattern in [r'api/search',r'orgaos=',r'orgaos/',r'orgao_id',r'orgaos\\?',r'search/orgaos',r'/orgaos']:
                      matches=list(re.finditer(pattern,body,re.I))
                      print("PATTERN",pattern,"COUNT",len(matches),"EXCERPTS",[body[max(0,m.start()-100):m.end()+150] for m in matches[:8]])
              except Exception as e:print("JS_ERROR",type(e).__name__,str(e)[:160])
          PY
