name: Probe PNCP filters (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify search module and organ options
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,time
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(req,timeout=25) as response:return response.read().decode("utf-8","replace")
                  except Exception:
                      if attempt:raise
                      time.sleep(.4)
          base="https://pncp.gov.br/app/"
          main=get(base+"main.31898e96dc8bd8d8.js")
          runtime=get(base+"runtime.57d4d4892b4e9635.js")
          print("RUNTIME",runtime[:3500])
          for term in ['path:"atas"','path:"contratacoes"','searchURL','loadChildren']:
              ms=list(re.finditer(re.escape(term),main))
              print("MAIN",term,"count",len(ms),"excerpt",[main[max(0,m.start()-240):m.end()+340] for m in ms[:3]])
          PY
