name: Probe PNCP filters (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check PNCP facet identifiers
        run: |
          python3 - <<'PY'
          import urllib.request,json,gzip,time
          u="https://pncp.gov.br/api/search/filters?tipos_documento=ata"
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=35) as r: b=r.read()
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(1)
          if b[:2]==b"\x1f\x8b":b=gzip.decompress(b)
          f=json.loads(b)["filters"]
          for key,val in f.items():
              print("FACET",key,len(val),val[:8])
          orgs=f["orgaos"]
          print("CPII",[(o["id"],o["nome"],o.get("cnpj")) for o in orgs if "PEDRO II" in o["nome"].upper()][:20])
          PY
