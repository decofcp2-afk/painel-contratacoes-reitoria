name: Probe PNCP filters (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect organ identifiers
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,json,time,re
          def get(url):
              req=urllib.request.Request(url,headers={"Origin":"https://decofcp2-afk.github.io","User-Agent":"Mozilla/5.0","Accept":"application/json"})
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(req,timeout=15) as resp: return resp.read()
                  except Exception:
                      if attempt: raise
                      time.sleep(.6)
          try:
              catalog=json.loads(get("https://pncp.gov.br/api/pncp/v1/orgaos"))
              print("CATALOG_KEYS",list(catalog[0]),"CPII",[x for x in catalog if x.get("cnpj")=="42414284000102"][:1])
          except Exception as e:print("CATALOG_ERROR",str(e)[:200])
          base="https://pncp.gov.br/api/search/?"
          for params in [{"tipos_documento":"ata","q":"COLEGIO PEDRO II","status":"todos","pagina":"1","tam_pagina":"20"},
                         {"tipos_documento":"ata","q":"","status":"todos","pagina":"1","tam_pagina":"2","orgaos":"42414284000102"}]:
              try:
                  result=json.loads(get(base+urllib.parse.urlencode(params)))
                  print("SEARCH",params,"total",result.get("total"),"orgs",[(x.get("orgao_id"),x.get("orgao_nome"),x.get("orgao_cnpj")) for x in result.get("items",[])[:8]])
              except Exception as e:print("SEARCH_ERROR",params,str(e)[:160])
          try:
              html=get("https://pncp.gov.br/app/atas").decode("utf-8","replace")
              print("SCRIPTS",re.findall(r'<script[^>]+src="([^"]+)"',html)[:15])
          except Exception as e:print("HTML_ERROR",str(e)[:160])
          PY
