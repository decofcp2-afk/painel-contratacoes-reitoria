name: Probe PNCP filters (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PNCP ata filter catalog
        run: |
          python3 - <<'PY'
          import urllib.request,json,time
          url="https://pncp.gov.br/api/search/filters?tipos_documento=ata"
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=40) as response:
                      raw=response.read()
                      print("CORS",response.headers.get("Access-Control-Allow-Origin"))
                      print("BYTES",len(raw))
                  break
              except Exception as e:
                  if attempt==2:raise
                  time.sleep(1)
          data=json.loads(raw)
          print("TYPE",type(data).__name__)
          print("KEYS",list(data) if isinstance(data,dict) else "")
          if isinstance(data,dict):
              for k,v in data.items():
                  print("FIELD",k,type(v).__name__,len(v) if hasattr(v,"__len__") else "",str(v[:3] if isinstance(v,list) else v)[:1600])
          PY
