name: Probe PNCP filters (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Identify search filter endpoints
        run: |
          python3 - <<'PY'
          import urllib.request,re,time
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=35) as response:return response.read().decode("utf-8","replace")
                  except Exception:
                      if attempt==2: raise
                      time.sleep(1)
          base="https://pncp.gov.br/app/"
          s=get(base+"main.31898e96dc8bd8d8.js")
          print("SIZE",len(s))
          for term in ["orgaos", "orgao_id","searchURL","/filters","facets","/filtros","esferas","api/search"]:
              ms=list(re.finditer(term,s,re.I))
              print("TERM",term,len(ms))
              for m in ms[:25]:print("SNIP",term,s[max(0,m.start()-130):m.start()+200][:330])
          PY
