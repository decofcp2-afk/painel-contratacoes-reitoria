name: Probe PNCP search (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check response fields and pagination
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request, json
          queries = [
            {"tipos_documento":"ata","q":"computador","pag":"1","tam_pagina":"2","status":"vigente"},
            {"tipos_documento":"ata","q":"computador","pag":"2","tam_pagina":"2","status":"vigente"},
            {"tipos_documento":"ata","q":"computador","pagina":"2","tam_pagina":"2","status":"vigente"},
            {"tipos_documento":"ata","q":"computador","pag":"1","tam_pagina":"2","status":"nao_vigente"},
            {"tipos_documento":"ata","q":"","pag":"1","tam_pagina":"2","status":"vigente"},
          ]
          for params in queries:
              url = "https://pncp.gov.br/api/search/?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"Origin":"https://decofcp2-afk.github.io","User-Agent":"Mozilla/5.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      result = json.load(response)
                      items = result.get("items",[])
                      print("QUERY",params,"cors",response.headers.get("Access-Control-Allow-Origin"),
                          "meta",{key:val for key,val in result.items() if key!="items"},
                          "first_id",items[0].get("id") if items else None)
                      if items:
                          print("ITEM",json.dumps(items[0],ensure_ascii=False)[:4500])
              except Exception as error:
                  print("QUERY",params,"ERROR",type(error).__name__, str(error)[:300])
          PY
